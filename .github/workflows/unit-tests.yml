name: Unit Tests

on:
  push:
    branches: [main, "feat-*", "docs/**", "hotfix*", "release/*"]
  pull_request:
    branches: [main, "feat-*"]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Swift Testing (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ForgeRuleCore/.build
          key: ${{ runner.os }}-spm-tests-${{ hashFiles('ForgeRuleCore/Package.swift', 'ForgeRuleCore/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-tests-
            ${{ runner.os }}-spm-

      - name: Make scripts executable
        run: chmod +x Scripts/check-test-governance.sh Scripts/run-tests.sh

      - name: Test governance gate
        run: ./Scripts/check-test-governance.sh

      - name: Run unit tests
        run: ./Scripts/run-tests.sh

      - name: Job summary
        if: always()
        run: |
          echo "### Unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner: \`./Scripts/run-tests.sh\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Policy: [TESTING.md](ForgeRuleCore/docs/TESTING.md)" >> "$GITHUB_STEP_SUMMARY"
