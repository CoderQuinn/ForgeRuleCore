name: CI

on:
  push:
    branches: [main, "feat-*", "docs/**", "hotfix*", "release/*"]
  pull_request:
    branches: [main, "feat-*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ForgeRuleCore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ForgeRuleCore/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('ForgeRuleCore/Package.swift', 'ForgeRuleCore/**/Package.resolved') }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift toolchain
        run: swift --version

      - name: Test governance gate
        working-directory: .
        run: |
          chmod +x Scripts/check-test-governance.sh Scripts/run-tests.sh
          ./Scripts/check-test-governance.sh

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Summarize
        if: always()
        working-directory: .
        run: |
          echo "### ForgeRuleCore CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`ForgeRuleCore/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Governance: \`./Scripts/check-test-governance.sh\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: \`swift test\` (policy: ForgeRuleCore/docs/TESTING.md)" >> "$GITHUB_STEP_SUMMARY"
